services:
  jenkins:
    build: .
    container_name: jenkins
    # Root so the container can use the host's Docker socket. Fine for a local test box only.
    user: root
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # web UI
      - "127.0.0.1:50000:50000" # inbound agents (the Windows host)
      - "127.0.0.1:9418:9418"   # git-daemon below, so the Windows agent can clone too
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  # Serves this project's local git repo read-only at git://localhost:9418/repo, so the
  # local-build job can run the Jenkinsfile without pushing to GitHub. Shares the jenkins
  # container's network, so "localhost" means the same thing to Jenkins and the Windows host.
  git-daemon:
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache git-daemon
    container_name: jenkins-git-daemon
    restart: unless-stopped
    network_mode: "service:jenkins"
    environment:
      # The repo is owned by the Windows user, which git otherwise refuses to serve.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    command: ["git", "daemon", "--reuseaddr", "--export-all", "--base-path=/srv/git", "--verbose"]
    volumes:
      - ../..:/srv/git/repo:ro

volumes:
  jenkins_home:
