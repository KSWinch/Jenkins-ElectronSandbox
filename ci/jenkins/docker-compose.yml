services:
  jenkins:
    build: .
    container_name: jenkins
    # Root so the container can use the host's Docker socket. Fine for a local test box only.
    user: root
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # web UI
      - "127.0.0.1:50000:50000" # inbound agents (the Windows host)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
